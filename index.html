<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Agenda </title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #000000; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            padding: 20px;
            margin: 0;
        }
        

        .agenda-container { 
            width: 210mm; 
            min-height: 297mm;
            background: white; 
            padding: 20mm; 
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
            margin-bottom: 30px;
            position: relative;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .header-texto h1 { color: #333; margin: 0; font-size: 28px; }
        .logo-container img { max-width: 150px; height: auto; }

        .fecha-seccion { margin-bottom: 30px; font-weight: bold; color: #555; }
        .fecha-input { 
            border: none; border-bottom: 1px solid #ccc; width: 250px; 
            outline: none; font-size: 16px; padding: 5px; font-family: inherit;
        }
        
        .hora-bloque { display: flex; border-bottom: 1px solid #eee; padding: 8px 0; }
        .hora-label { width: 80px; font-weight: bold; color: #2c3e50; }
        .lineas-escritura { flex-grow: 1; }
        .linea { border-bottom: 1px solid #e0e0e0; height: 28px; margin-bottom: 4px; outline: none; }

  
        .controles {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-add { background: #28a745; color: white; }
        .btn-print { background: #d4af37; color: black; }
        .btn-clear { background: #dc3545; color: white; }

        @media print {
            body { background: white; padding: 0; }
            .controles { display: none; }
            .agenda-container { 
                box-shadow: none; border: none; margin: 0; 
                page-break-after: always; 
            }
        }
    </style>
</head>
<body>

<div id="hojas-container">
    </div>

<div class="controles">
    <button class="btn btn-add" onclick="crearHoja()">+ Añadir Hoja</button>
    <button class="btn btn-print" onclick="window.print()">Imprimir Todo (PDF)</button>
    <button class="btn btn-clear" onclick="borrarTodo()">Borrar Todo</button>
</div>

<script>
    const horas = ["08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00"];

    // Función para crear una hoja nueva
    function crearHoja(contenidoCargado = null) {
        const container = document.getElementById('hojas-container');
        const hojaId = Date.now();
        const hoja = document.createElement('div');
        hoja.className = 'agenda-container';
        hoja.id = `hoja-${hojaId}`;

        let filasHtml = '';
        horas.forEach(hora => {
            filasHtml += `
                <div class="hora-bloque">
                    <div class="hora-label">${hora}</div>
                    <div class="lineas-escritura">
                        <div class="linea" contenteditable="true" oninput="guardarDatos()"></div>
                        <div class="linea" contenteditable="true" oninput="guardarDatos()"></div>
                    </div>
                </div>`;
        });

        hoja.innerHTML = `
            <div class="header-area">
                <div class="header-texto"><h1>Agenda de Actividades</h1></div>
                <div class="logo-container"><img src="https://i.ibb.co/kVWh1gqX/image.png"></div>
            </div>
            <div class="fecha-seccion">
                DIA: <input type="text" class="fecha-input" placeholder="Escribe el día..." oninput="guardarDatos()">
            </div>
            <div class="agenda-cuerpo">${filasHtml}</div>
        `;

        container.appendChild(hoja);
        return hoja;
    }

    // Guardar en LocalStorage
    function guardarDatos() {
        const hojas = [];
        document.querySelectorAll('.agenda-container').forEach(hoja => {
            const fecha = hoja.querySelector('.fecha-input').value;
            const lineas = [];
            hoja.querySelectorAll('.linea').forEach(l => lineas.push(l.innerText));
            hojas.push({ fecha, lineas });
        });
        localStorage.setItem('agenda_datos', JSON.stringify(hojas));
    }

    // Cargar datos al abrir
    function cargarDatos() {
        const datos = JSON.parse(localStorage.getItem('agenda_datos'));
        if (!datos || datos.length === 0) {
            crearHoja();
        } else {
            datos.forEach(d => {
                const hoja = crearHoja();
                hoja.querySelector('.fecha-input').value = d.fecha;
                const lineasDivs = hoja.querySelectorAll('.linea');
                d.lineas.forEach((texto, i) => {
                    if(lineasDivs[i]) lineasDivs[i].innerText = texto;
                });
            });
        }
    }

    function borrarTodo() {
        if(confirm("¿Seguro que quieres borrar todas las hojas?")) {
            localStorage.removeItem('agenda_datos');
            location.reload();
        }
    }

    window.onload = cargarDatos;
</script>

</body>
</html>
