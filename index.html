<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Agenda con Checkbox</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #000000; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            padding: 20px;
            margin: 0;
        }
        
        .agenda-container { 
            width: 210mm; 
            min-height: 297mm;
            background: white; 
            padding: 20mm; 
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .header-texto h1 { color: #333; margin: 0; font-size: 28px; }
        .logo-container img { max-width: 150px; height: auto; }

        .fecha-seccion { margin-bottom: 30px; font-weight: bold; color: #555; }
        .fecha-input { 
            border: none; border-bottom: 1px solid #ccc; width: 250px; 
            outline: none; font-size: 16px; padding: 5px; font-family: inherit;
        }
        
        .hora-bloque { display: flex; border-bottom: 1px solid #eee; padding: 8px 0; }
        .hora-label { width: 80px; font-weight: bold; color: #2c3e50; }
        .lineas-escritura { flex-grow: 1; }
        
        /* Contenedor de línea con checkbox */
        .linea-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .checkbox-visto {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #28a745;
        }

        .linea { 
            flex-grow: 1;
            border-bottom: 1px solid #e0e0e0; 
            height: 28px; 
            outline: none; 
            transition: all 0.3s;
        }

        /* Estilo cuando la tarea está marcada */
        .completado {
            text-decoration: line-through;
            color: #aaa;
        }

        .controles {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-add { background: #28a745; color: white; }
        .btn-print { background: #d4af37; color: black; }
        .btn-clear { background: #dc3545; color: white; }

        @media print {
            body { background: white; padding: 0; }
            .controles { display: none; }
            .agenda-container { box-shadow: none; border: none; margin: 0; page-break-after: always; }
            .checkbox-visto { border: 1px solid #000; }
        }
    </style>
</head>
<body>

<div id="hojas-container"></div>

<div class="controles">
    <button class="btn btn-add" onclick="crearHoja()">+ Añadir Hoja</button>
    <button class="btn btn-print" onclick="window.print()">Imprimir Todo</button>
    <button class="btn btn-clear" onclick="borrarTodo()">Borrar Todo</button>
</div>

<script>
    const horas = ["08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00"];

    function crearHoja() {
        const container = document.getElementById('hojas-container');
        const hoja = document.createElement('div');
        hoja.className = 'agenda-container';

        let filasHtml = '';
        horas.forEach(hora => {
            filasHtml += `
                <div class="hora-bloque">
                    <div class="hora-label">${hora}</div>
                    <div class="lineas-escritura">
                        <div class="linea-wrapper">
                            <input type="checkbox" class="checkbox-visto" onchange="toggleCompletado(this); guardarDatos()">
                            <div class="linea" contenteditable="true" oninput="guardarDatos()"></div>
                        </div>
                        <div class="linea-wrapper">
                            <input type="checkbox" class="checkbox-visto" onchange="toggleCompletado(this); guardarDatos()">
                            <div class="linea" contenteditable="true" oninput="guardarDatos()"></div>
                        </div>
                    </div>
                </div>`;
        });

        hoja.innerHTML = `
            <div class="header-area">
                <div class="header-texto"><h1>Agenda de Actividades</h1></div>
                <div class="logo-container"><img src="https://i.ibb.co/kVWh1gqX/image.png"></div>
            </div>
            <div class="fecha-seccion">DIA: <input type="text" class="fecha-input" placeholder="Escribe el día..." oninput="guardarDatos()"></div>
            <div>${filasHtml}</div>
        `;

        container.appendChild(hoja);
        return hoja;
    }

    function toggleCompletado(checkbox) {
        const linea = checkbox.nextElementSibling;
        if (checkbox.checked) {
            linea.classList.add('completado');
        } else {
            linea.classList.remove('completado');
        }
    }

    function guardarDatos() {
        const hojas = [];
        document.querySelectorAll('.agenda-container').forEach(hoja => {
            const fecha = hoja.querySelector('.fecha-input').value;
            const filas = [];
            hoja.querySelectorAll('.linea-wrapper').forEach(wrapper => {
                filas.push({
                    texto: wrapper.querySelector('.linea').innerText,
                    hecho: wrapper.querySelector('.checkbox-visto').checked
                });
            });
            hojas.push({ fecha, filas });
        });
        localStorage.setItem('agenda_v3', JSON.stringify(hojas));
    }

    function cargarDatos() {
        const datos = JSON.parse(localStorage.getItem('agenda_v3'));
        if (!datos || datos.length === 0) {
            crearHoja();
        } else {
            datos.forEach(d => {
                const hoja = crearHoja();
                hoja.querySelector('.fecha-input').value = d.fecha;
                const wrappers = hoja.querySelectorAll('.linea-wrapper');
                d.filas.forEach((item, i) => {
                    if(wrappers[i]) {
                        const linea = wrappers[i].querySelector('.linea');
                        const check = wrappers[i].querySelector('.checkbox-visto');
                        linea.innerText = item.texto;
                        check.checked = item.hecho;
                        if(item.hecho) linea.classList.add('completado');
                    }
                });
            });
        }
    }

    function borrarTodo() {
        if(confirm("¿Borrar todas las hojas y datos?")) {
            localStorage.removeItem('agenda_v3');
            location.reload();
        }
    }

    window.onload = cargarDatos;
</script>

</body>
</html>
