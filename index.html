<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agenda de Actividades</title>
    <style>
        /* Fondo negro para la visualización en pantalla */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #000000; 
            display: flex; 
            justify-content: center; 
            padding: 0;
            margin: 0;
        }
        
        /* Contenedor ajustado a tamaño A4 real */
        .agenda-container { 
            width: 210mm; 
            min-height: 297mm;
            background: white; 
            padding: 20mm; 
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        /* Encabezado con Logo a la derecha */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .header-texto h1 { 
            color: #333; 
            margin: 0;
            font-size: 28px;
        }

        .logo-container img {
            max-width: 180px;
            height: auto;
        }

        /* Texto corregido sin caracteres extraños */
        .fecha-seccion { 
            margin-bottom: 30px; 
            font-weight: bold; 
            color: #555; 
            font-size: 16px;
        }

        .fecha-input { 
            border: none; 
            border-bottom: 1px solid #ccc; 
            width: 250px; 
            outline: none; 
            font-size: 16px; 
            padding: 5px;
            font-family: inherit;
        }
        
        .hora-bloque { 
            display: flex; 
            border-bottom: 1px solid #eee; 
            padding: 10px 0; 
        }

        .hora-label { 
            width: 80px; 
            font-weight: bold; 
            color: #2c3e50; 
            padding-top: 5px; 
        }

        .lineas-escritura { 
            flex-grow: 1; 
        }

        .linea { 
            border-bottom: 1px solid #e0e0e0; 
            height: 30px; 
            margin-bottom: 5px; 
        }

        .linea:last-child { 
            margin-bottom: 0; 
        }

        [contenteditable] { 
            outline: none; 
            width: 100%; 
        }

        .btn-imprimir {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 25px;
            background: #d4af37;
            color: black;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }
        
        @media print {
            body { background: white; padding: 0; margin: 0; }
            .agenda-container { 
                box-shadow: none; 
                border: none; 
                width: 100%; 
                height: 100%;
                padding: 10mm;
            }
            .btn-imprimir { display: none; }
        }
    </style>
</head>
<body>

<div class="agenda-container">
    <div class="header-area">
        <div class="header-texto">
            <h1>Agenda de Actividades</h1>
        </div>
        <div class="logo-container">
            <img src="https://i.ibb.co/kVWh1gqX/image.png" alt="Logo">
        </div>
    </div>
    
    <div class="fecha-seccion">
        DIA: <input type="text" class="fecha-input" placeholder="">
    </div>

    <div id="agenda">
    </div>
    
    <button class="btn-imprimir" onclick="window.print()">Imprimir Agenda</button>
</div>

<script>
    // Horario extendido para ocupar toda la hoja
    const horas = [
        "08:00", "09:00", "10:00", "11:00", "12:00", 
        "13:00", "14:00", "15:00", "16:00", "17:00",
    ];
    const agendaDiv = document.getElementById('agenda');

    horas.forEach(hora => {
        agendaDiv.innerHTML += `
            <div class="hora-bloque">
                <div class="hora-label">${hora}</div>
                <div class="lineas-escritura">
                    <div class="linea" contenteditable="true"></div>
                    <div class="linea" contenteditable="true"></div>
                </div>
            </div>
        `;
    });
</script>

</body>
</html>
